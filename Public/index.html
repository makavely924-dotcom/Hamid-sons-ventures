<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hamid & Son's Ventures</title><style>
body{margin:0;font-family:Arial;background:#f6f8fb;color:#142033}.app{max-width:560px;margin:auto;background:#fff;min-height:100vh}.top{padding:18px;border-bottom:1px solid #e5e9f0;position:sticky;top:0;background:#fff}.brand{font-weight:900;color:#0b57d0}.main{padding:18px 18px 80px}.hide{display:none}.hero{padding:24px;border-radius:22px;background:linear-gradient(135deg,#0b57d0,#4b8df8);color:#fff;margin:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.box{border:1px solid #e5e9f0;border-radius:16px;padding:14px;margin:10px 0}.icon{font-size:38px;text-align:center;background:#eef4ff;padding:12px;border-radius:14px}.price{font-weight:900;color:#0b57d0;font-size:18px}input,select,textarea{width:100%;padding:12px;box-sizing:border-box;border:1px solid #e2e7ee;border-radius:11px;margin:6px 0 10px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800}.primary{background:#0b57d0;color:white}.outline{background:white;color:#0b57d0;border:1px solid #0b57d0}.full{width:100%}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:flex;justify-content:space-around;background:white;border-top:1px solid #e5e9f0;padding:9px}.status{color:#0a8f5a;font-weight:800;font-size:12px}.tabs{display:flex;gap:6px;overflow:auto}
</style><div class=app><div class=top><div class=brand>HSV • HAMID & SON'S VENTURES</div><small>Building materials • Ordering • Delivery</small></div><div class=main>
<div id=store><input id=q placeholder="Search cement, tiles, iron rods..." oninput=load()><div class=hero><h1>Build Better Together</h1><p>Order quality building materials with easy delivery.</p></div><div id=cats class=tabs></div><h2>Products</h2><div id=products class=grid></div></div>
<div id=detail class=hide></div><div id=cart class=hide></div><div id=orders class=hide></div><div id=admin class=hide></div></div>
<div class=nav><button onclick=screen("store")>🏠<br>Home</button><button onclick=screen("orders")>📋<br>Orders</button><button onclick=screen("cart")>🛒<br>Cart <span id=cc></span></button><button onclick=screen("admin")>⚙️<br>Admin</button></div></div>
<script>
let cart=JSON.parse(localStorage.hsv_cart||"[]"),token=localStorage.hsv_admin||"",cat="All";
const $=x=>document.getElementById(x),money=n=>"₦"+Number(n).toLocaleString("en-NG");
async function api(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},...o}),x=await r.json();if(!r.ok)throw Error(x.error||"Request failed");return x}
async function load(){let [cs,ps]=await Promise.all([api("/api/categories"),api("/api/products?q="+encodeURIComponent($("q").value||"")+"&category="+encodeURIComponent(cat))]);$("cats").innerHTML=["All",...cs].map(c=>`<button class="btn ${cat==c?"primary":"outline"}" onclick="cat='${c}';load()">${c}</button>`).join(" ");$("products").innerHTML=ps.map(p=>`<div class=card><div class=icon>${p.icon}</div><h3>${p.name}</h3><p>${p.description}</p><div class=price>${money(p.price)}</div><button class="btn primary full" onclick='detail(${JSON.stringify(p)})'>View & Order</button></div>`).join("")||"No products found.";update()}
function detail(p){$("detail").innerHTML=`<button class="btn outline" onclick='screen("store")'>← Back</button><div class=box><div class=icon>${p.icon}</div><h2>${p.name}</h2><div class=price>${money(p.price)}</div><p>${p.description}</p><input id=qty type=number min=1 value=1><button class="btn primary full" onclick='add(${p.id})'>Add to Cart</button></div>`;screen("detail")}
function add(id){let q=Math.max(1,Number($("qty").value)||1),x=cart.find(a=>a.productId==id);x?x.qty+=q:cart.push({productId:id,qty:q});localStorage.hsv_cart=JSON.stringify(cart);screen("cart")}
async function renderCart(){if(!cart.length){$("cart").innerHTML="<div class=box>Your cart is empty.</div>";return}let ps=await api("/api/products"),html="<h2>Your Cart</h2>",total=0;cart.forEach(i=>{let p=ps.find(a=>a.id==i.productId);if(!p)return;total+=p.price*i.qty;html+=`<div class=box><b>${p.name}</b><p>${i.qty} × ${money(p.price)} = ${money(p.price*i.qty)}</p><button class="btn outline" onclick='removeItem(${p.id})'>Remove</button></div>`});$("cart").innerHTML=html+`<h3>Total: <span class=price>${money(total)}</span></h3><button class="btn primary full" onclick=checkout()>Continue to Delivery →</button>`}
function removeItem(id){cart=cart.filter(x=>x.productId!=id);localStorage.hsv_cart=JSON.stringify(cart);renderCart();update()}
function checkout(){$("detail").innerHTML=`<button class="btn outline" onclick='screen("cart")'>← Back</button><h2>Delivery & Order</h2><div class=box><input id=cn placeholder="Customer name"><input id=cp placeholder="Phone number"><textarea id=ca placeholder="Delivery address"></textarea><select id=cd><option>Standard</option><option>Express</option></select><button class="btn primary full" onclick=place()>Place Order & WhatsApp Me</button></div>`;screen("detail")}
async function place(){try{let x=await api("/api/orders",{method:"POST",body:JSON.stringify({customerName:$("cn").value,phone:$("cp").value,address:$("ca").value,delivery:$("cd").value,items:cart})});cart=[];localStorage.hsv_cart="[]";update();window.open(x.whatsapp,"_blank");alert("Order "+x.id+" created.");screen("orders")}catch(e){alert(e.message)}}
async function renderAdmin(){if(!token){$("admin").innerHTML=`<h2>Admin Login</h2><div class=box><input id=au placeholder=Username><input id=ap type=password placeholder=Password><button class="btn primary full" onclick=login()>Login</button></div>`;return}try{let [ps,os]=await Promise.all([api("/api/admin/products"),api("/api/admin/orders")]);$("admin").innerHTML=`<h2>Admin Dashboard</h2><div class=box><h3>Products</h3>${ps.map(p=>`<p><b>${p.name}</b><br><span class=price>${money(p.price)}</span> <button class="btn outline" onclick='edit(${p.id},${p.price})'>Edit price</button></p>`).join("")}</div><div class=box><h3>Orders</h3>${os.map(o=>`<p><b>${o.id}</b> — ${o.customer_name}<br>${money(o.total)} • <span class=status>${o.status}</span><br><button class="btn outline" onclick='status("${o.id}")'>Update status</button></p>`).join("")||"No orders."}</div><button class="btn outline full" onclick=logout()>Logout</button>`}catch(e){logout()}}
async function login(){try{let x=await api("/api/admin/login",{method:"POST",body:JSON.stringify({username:$("au").value,password:$("ap").value})});token=x.token;localStorage.hsv_admin=token;renderAdmin()}catch(e){alert(e.message)}}
async function edit(id,p){let v=prompt("New price in naira",p);if(v){await api("/api/admin/products/"+id,{method:"PATCH",body:JSON.stringify({price:Number(v)})});renderAdmin();load()}}
async function status(id){let v=prompt("New status: New, Confirmed, Preparing, Out for delivery, Delivered, Cancelled");if(v){await api("/api/admin/orders/"+id,{method:"PATCH",body:JSON.stringify({status:v})});renderAdmin()}}
function logout(){token="";localStorage.removeItem("hsv_admin");renderAdmin()}
async function renderOrders(){$("orders").innerHTML="<h2>My Orders</h2><div class=box>Orders are sent to the business WhatsApp after checkout.</div>"}
function screen(id){["store","detail","cart","orders","admin"].forEach(x=>$(x).classList.add("hide"));$(id).classList.remove("hide");if(id=="cart")renderCart();if(id=="orders")renderOrders();if(id=="admin")renderAdmin();update();scrollTo(0,0)}
function update(){$("cc").textContent=cart.reduce((a,x)=>a+x.qty,0)||""}load();update();
</script></html>
